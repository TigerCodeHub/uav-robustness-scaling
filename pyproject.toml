[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuperception"
version = "1.0.0"
description = "Model-size trends in latency and attitude-coupling robustness of a depth-based UAV policy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tiger Deng" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=7", "torch>=2.0"]

[tool.setuptools.packages.find]
include = ["gpuperception*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
